global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: video-api
    static_configs:
      - targets: ["video-api:8080"]
  - job_name: video-worker
    static_configs:
      - targets: ["video-worker:8081"]
  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8082"]

