services:
  video-api:
    build: ./services/video-api
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-fiap123}@postgres:5432/${POSTGRES_DB:-video_platform}?sslmode=disable
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8083/realms/fiap-video}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/fiap-video/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: fiap-video-spa
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fiap1234}
    ports: ["8080:8080"]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  video-worker:
    build: ./services/video-worker
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-fiap123}@postgres:5432/${POSTGRES_DB:-video_platform}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS:-fiap123}@rabbitmq:5672/
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fiap1234}
      WORKER_PREFETCH: "1"
      PROCESSING_TIMEOUT: 10m
      # Local-only test hook. Leave empty in deployments to disable it.
      WORKER_FORCE_FAILURE_PREFIX: ${WORKER_FORCE_FAILURE_PREFIX:-force-failure-}
    networks: [backend]
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  notification-service:
    build: ./services/notification-service
    environment:
      HTTP_ADDR: ":8082"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS:-fiap123}@rabbitmq:5672/
      SMTP_ADDR: mailpit:1025
      NOTIFICATION_FROM: no-reply@fiap-video.local
      NOTIFICATION_TO: ${NOTIFICATION_TO:-admin@fiap-video.local}
    networks: [backend]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8083}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-fiap-video}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-fiap-video-spa}
    ports: ["5173:80"]
    networks: [backend]
    depends_on:
      video-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

